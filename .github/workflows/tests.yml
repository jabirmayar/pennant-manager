name: Tests and dependency security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 6 * * 1'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '^11.0'
            filament: '^4.0'
            livewire: '^3.0'
            audit: false
          - laravel: '^12.0'
            filament: '^4.0'
            livewire: '^3.0'
            audit: true
          - laravel: '^12.0'
            filament: '^5.0'
            livewire: '^4.0'
            audit: true
    name: Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - name: Install compatible development dependencies
        run: >-
          composer update --with='laravel/framework:${{ matrix.laravel }}'
          --with='filament/filament:${{ matrix.filament }}'
          --with='livewire/livewire:${{ matrix.livewire }}'
          --prefer-dist --no-interaction --no-scripts --prefer-stable
      - name: Audit current runtime dependencies
        if: matrix.audit
        run: composer audit --no-dev --abandoned=report
      - name: Report legacy framework dependency advisories
        if: ${{ !matrix.audit }}
        continue-on-error: true
        run: composer audit --no-dev --abandoned=report
      - run: composer test -- --compact
